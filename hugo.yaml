# =====================================================================
#  Quantum Lineage — Hugo + Hextra configuration
#  Change the site name/tagline/baseURL in ONE place: the `params` block
#  below (siteName, params.description) and the top-level `baseURL`.
# =====================================================================

baseURL: "https://rskhatiwada.github.io/quantum-lineage/"
title: &siteName "Quantum Lineage"

enableRobotsTXT: true
enableGitInfo: true

# Every page uses the same width: the top navbar is the only navigation
# surface, so the docs-style left sidebar tree (which reserved a variable
# amount of space depending on section depth) is disabled everywhere.
cascade:
  - target:
      path: "**"
    params:
      sidebar:
        hide: true

outputs:
  home: [html, rss]
  page: [html]
  section: [html, rss]

defaultContentLanguage: en
languages:
  en:
    label: English
    weight: 1
    title: *siteName

module:
  hugoVersion:
    extended: true
    min: "0.146.0"
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
        enable: true

enableInlineShortcodes: true

taxonomies:
  tag: tags
  status: status
  tier: tier

menu:
  main:
    - identifier: ontology
      name: Ontology
      pageRef: /ontology
      weight: 1
    - identifier: framework
      name: Framework
      pageRef: /framework
      weight: 2
    - identifier: epochs
      name: Epochs
      pageRef: /epochs
      weight: 3
    - identifier: library
      name: Library
      pageRef: /library
      weight: 4
    - identifier: graph
      name: Graph
      pageRef: /graph
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search

params:
  description: "A genealogy of quantum information science — from the EPR paradox to topological quantum computation."

  navbar:
    displayTitle: true
    displayLogo: true
    width: wide
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 22
      height: 22

  theme:
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: false
    displayPoweredBy: false
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  toc:
    displayTags: true

  highlight:
    copy:
      enable: true
      display: hover

  page:
    width: normal

  imageZoom:
    enable: true

  comments:
    enable: false
